services:
  - type: web
    name: notice2action
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: groq/compound
      - key: MONGODB_URI
        sync: false
      - key: VITE_API_URL
        value: https://notice2action.onrender.com
