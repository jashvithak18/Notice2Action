services:
  - type: web
    name: notice2action
    env: node
    plan: free
    # Frontend is pre-built and committed to git (frontend/dist).
    # Render only needs to install backend dependencies.
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: groq/compound-mini
      - key: MONGODB_URI
        sync: false
      - key: VITE_API_URL
        value: https://notice2action.onrender.com
